services:
  redis:
    image: redis:alpine
    container_name: lambchat-redis
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:8.2.5
    container_name: lambchat-mongodb
    restart: always
    command: mongod --wiredTigerCacheSizeGB 0.5
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  lambchat:
    container_name: lambchat
    build:
      context: ..
      dockerfile: Dockerfile
    image: lambchat:current
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongodb:27017
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - MCP_ENCRYPTION_SALT=${MCP_ENCRYPTION_SALT:?MCP_ENCRYPTION_SALT is required}
      - E2B_API_KEY=${E2B_API_KEY:-}
      - ENABLE_SANDBOX=${ENABLE_SANDBOX:-false}
      - SANDBOX_PLATFORM=${SANDBOX_PLATFORM:-daytona}
      - DOCKER_SANDBOX_NAMESPACE=${DOCKER_SANDBOX_NAMESPACE:-default}
      - DOCKER_SANDBOX_IMAGE=${DOCKER_SANDBOX_IMAGE:-python:3.12-slim-bookworm}
      - DOCKER_SANDBOX_TIMEOUT=${DOCKER_SANDBOX_TIMEOUT:-180}
      - DOCKER_SANDBOX_IDLE_TIMEOUT=${DOCKER_SANDBOX_IDLE_TIMEOUT:-1800}
      - DOCKER_SANDBOX_CLEANUP_INTERVAL=${DOCKER_SANDBOX_CLEANUP_INTERVAL:-60}
      - DOCKER_SANDBOX_MAX_CONTAINERS=${DOCKER_SANDBOX_MAX_CONTAINERS:-20}
      - DOCKER_SANDBOX_MEMORY_LIMIT_MB=${DOCKER_SANDBOX_MEMORY_LIMIT_MB:-1024}
      - DOCKER_SANDBOX_CPU_LIMIT=${DOCKER_SANDBOX_CPU_LIMIT:-1.0}
      - DOCKER_SANDBOX_PIDS_LIMIT=${DOCKER_SANDBOX_PIDS_LIMIT:-256}
      - DOCKER_SANDBOX_NETWORK_MODE=${DOCKER_SANDBOX_NETWORK_MODE:-bridge}
      - DOCKER_SANDBOX_MAX_OUTPUT_BYTES=${DOCKER_SANDBOX_MAX_OUTPUT_BYTES:-10485760}
      - E2B_TEMPLATE=${E2B_TEMPLATE:-base}
      - LLM_MODEL_CACHE_SIZE=${LLM_MODEL_CACHE_SIZE:-50}
      - SESSION_MAX_EVENTS_PER_TRACE=${SESSION_MAX_EVENTS_PER_TRACE:-10000}
      - LOG_LEVEL=INFO
      - ENABLE_MESSAGE_HISTORY=true
      - EVENT_MERGE_INTERVAL=60
    volumes:
      - lamb-data:/app/data
      - ./workspace:/app/workspace
      - ./uploads:/app/uploads

volumes:
  redis-data:
  mongodb-data:
  lamb-data:
